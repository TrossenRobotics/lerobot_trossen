[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_trossen"
version = "0.1.0"
description = "Trossen Robotics LeRobot integration - Robots"
authors = [{ name = "Trossen Robotics" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# lerobot 0.6.0 required: depth capture uses Camera.read_latest_depth(), added in 0.6.0.
# 0.6.0 slimmed the base install, so the dataset/hardware/viz deps that lerobot-record
# and lerobot-teleoperate need now come from the "core-scripts" extra.
dependencies = [
  "lerobot[core-scripts]>=0.6.0",
  "trossen_arm>=1.9.0",
  # SLATE base driver: Linux wheels only, and only needed by the Mobile AI robot.
  "trossen-slate>=0.0.3; sys_platform == 'linux'",
  # RealSense camera support: not installed on Jetson
  "lerobot[intelrealsense]>=0.6.0; sys_platform != 'linux' or platform_machine != 'aarch64'"
]

[project.scripts]
# lerobot-record that also resets the Rivet odometry at the start of every episode.
lerobot-rivet-record = "lerobot_robot_trossen.scripts.lerobot_rivet_record:main"


[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_trossen*"]
